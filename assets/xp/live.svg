<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-labelledby="live-title">
  <title id="live-title">Live Dashboard</title>
  <!-- The live service, as a green orb. -->
  <defs>
    <radialGradient id="orb-body" cx=".36" cy=".3" r=".92">
      <stop stop-color="#E2FBB0"/>
      <stop offset=".35" stop-color="#8CDB2C"/>
      <stop offset=".68" stop-color="#3D9E1E"/>
      <stop offset=".92" stop-color="#17631A"/>
      <stop offset="1" stop-color="#0C4406"/>
    </radialGradient>
    <radialGradient id="orb-shine" cx=".5" cy=".5" r=".5">
      <stop stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-glow" cx=".5" cy=".5" r=".5">
      <stop stop-color="#6BE01E" stop-opacity=".5"/>
      <stop offset=".7" stop-color="#6BE01E" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6BE01E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="24" cy="24" r="23" fill="url(#orb-glow)"/>
  <circle cx="24" cy="24" r="19.5" fill="url(#orb-body)" stroke="#0A3804" stroke-opacity=".6"/>
  <ellipse cx="17.5" cy="14.5" rx="8.5" ry="5.5" fill="url(#orb-shine)" transform="rotate(-22 17.5 14.5)"/>
  <path d="M9 30 A16.5 16.5 0 0 0 38.5 32" fill="none" stroke="#DFF7B2" stroke-opacity=".5" stroke-width="1.2"/>
</svg>
