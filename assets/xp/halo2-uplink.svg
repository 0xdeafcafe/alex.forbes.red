<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-labelledby="uplink-title">
  <title id="uplink-title">Halo 2 Uplink</title>
  <!-- The h2 Uplink identity: the chrome 2 over the Earth at sunrise. -->
  <defs>
    <linearGradient id="uplink-two" x2="0" y2="1">
      <stop stop-color="#F1F7FB"/>
      <stop offset=".42" stop-color="#A9C7E2"/>
      <stop offset=".6" stop-color="#426B9F"/>
      <stop offset="1" stop-color="#21467C"/>
    </linearGradient>
    <linearGradient id="uplink-sunrise" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0B2138"/>
      <stop offset=".3" stop-color="#1E6E5A"/>
      <stop offset=".62" stop-color="#E8891E"/>
      <stop offset="1" stop-color="#FBB034"/>
    </linearGradient>
  </defs>
  <g transform="scale(3)">
    <rect x=".06" y=".06" width="15.88" height="15.88" rx="1.6" fill="#050810" stroke="#1E4966" stroke-width=".12"/>
    <!-- Earth limb rising behind the numeral, atmosphere first -->
    <circle cx="2.4" cy="2.9" r=".14" fill="#CFE7F5"/>
    <circle cx="14.2" cy="1.8" r=".11" fill="#CFE7F5"/>
    <path d="M-3 12.1 A11.3 11.3 0 0 1 19 12.1 L19 16 L-3 16 Z" fill="url(#uplink-sunrise)" opacity=".97"/>
    <path d="M-3 12.1 A11.3 11.3 0 0 1 19 12.1" fill="none" stroke="#B8E6F5" stroke-width=".36"/>
    <path d="M-3 12.1 A11.3 11.3 0 0 1 19 12.1" fill="none" stroke="#F5A623" stroke-width=".6" opacity=".5" transform="translate(0 -.5)"/>
    <path d="M2.2 5.1C2.5 2.9 4.4 1.6 7.8 1.6C11.4 1.6 13.8 3 13.8 5.5C13.8 7.1 12.9 8.2 10.8 9.5L6.4 12.1H13.8V14.4H2.2V12L9.4 7.5C10.6 6.7 11.2 6.1 11.2 5.5C11.2 4.4 9.9 3.8 8 3.8C6.1 3.8 5 4.4 4.8 5.5Z" fill="url(#uplink-two)" stroke="#AECFE9" stroke-width=".38" stroke-linejoin="round"/>
    <path d="M13.72 4.9Q13.8 6.7 12.9 7.8M13.7 12.2V14.3H8" fill="none" stroke="#F1BB7F" stroke-width=".3" stroke-linecap="round"/>
  </g>
