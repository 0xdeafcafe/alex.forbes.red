<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-labelledby="uplink-title">
  <title id="uplink-title">Halo 2 Uplink</title>
  <!-- An original mark in the old Bungie.net language: a blue tile, white segmented ring. -->
  <defs>
    <linearGradient id="bnet-tile" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3F7BC4"/>
      <stop offset=".45" stop-color="#2A5CA4"/>
      <stop offset="1" stop-color="#173A75"/>
    </linearGradient>
    <linearGradient id="bnet-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".4"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="8" fill="url(#bnet-tile)" stroke="#0E2C5C" stroke-opacity=".7"/>
  <path d="M9 9 A39 39 0 0 1 39 9 L39 21 Q24 27 9 21 Z" fill="url(#bnet-gloss)"/>
  <!-- seventh-column style ring: seven segments around a dot -->
  <g stroke="#fff" stroke-width="5.4" stroke-linecap="round" fill="none">
    <circle cx="24" cy="24.5" r="12.4" stroke-dasharray="8.6 2.52" stroke-dashoffset="4.3" transform="rotate(12.8 24 24.5)"/>
  </g>
  <circle cx="24" cy="24.5" r="2.4" fill="#fff"/>
</svg>
